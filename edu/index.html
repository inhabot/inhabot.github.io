<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f0" />
    <title>채팅 구조대 · 발표 대본</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="presenter">
      <aside class="reference" aria-label="슬라이드 미리보기와 읽기 설정">
        <div class="slide-label">
          <span class="eyebrow">SLIDE</span>
          <div class="slide-number"><span id="slide-number">01</span><span class="total">/ 14</span></div>
        </div>

        <figure class="preview">
          <button id="preview-button" class="preview-button" type="button" aria-label="현재 슬라이드 크게 보기" aria-haspopup="dialog">
            <img id="slide-image" src="./assets/slides/slide-01.jpg" width="1280" height="721" alt="발표 슬라이드 1" />
            <span class="zoom-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" /></svg>
            </span>
          </button>
          <figcaption>눌러서 크게 보기</figcaption>
        </figure>

        <div class="reading-settings" role="group" aria-label="대본 글자 크기">
          <span class="settings-label">글자 크기</span>
          <div class="font-controls">
            <button id="font-smaller" type="button" aria-label="대본 글자 작게"><span aria-hidden="true">가<span class="size-sign">−</span></span></button>
            <button id="font-larger" type="button" aria-label="대본 글자 크게"><span aria-hidden="true">가<span class="size-sign">+</span></span></button>
          </div>
          <span id="font-status" class="sr-only" role="status"></span>
        </div>
      </aside>

      <main class="reading-panel">
        <div id="script-scroll" class="script-scroll" tabindex="0" aria-label="현재 슬라이드 대본">
          <article id="script" class="script" aria-label="슬라이드 1 대본"></article>
          <noscript>대본을 보려면 브라우저에서 JavaScript를 켜주세요.</noscript>
        </div>
        <div id="scroll-hint" class="scroll-hint" aria-hidden="true" hidden>
          아래로 이어집니다 <span>↓</span>
        </div>
      </main>

      <footer class="navigation" aria-label="슬라이드 이동">
        <button id="previous" class="nav-button previous" type="button" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 6-6 6 6 6" /></svg>
          이전
        </button>
        <div class="position">
          <label class="page-picker">
            <span class="sr-only">이동할 슬라이드</span>
            <select id="page-select" aria-label="이동할 슬라이드"></select>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 10 4 4 4-4" /></svg>
          </label>
          <progress id="progress" max="14" value="1" aria-label="슬라이드 진행"></progress>
        </div>
        <button id="next" class="nav-button next" type="button">
          다음
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m10 6 6 6-6 6" /></svg>
        </button>
      </footer>
    </div>

    <p id="slide-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <dialog id="preview-dialog" class="preview-dialog" aria-label="현재 슬라이드 확대 보기">
      <form method="dialog"><button class="close-preview" aria-label="슬라이드 확대 보기 닫기" autofocus>닫기 <span aria-hidden="true">×</span></button></form>
      <img id="large-image" width="1280" height="721" alt="" />
    </dialog>
  </body>
</html>
